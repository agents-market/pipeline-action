name: Publish pipeline-action to npm

on:
  push:
    tags:
      - 'pipeline-action-v*'
  workflow_dispatch:

jobs:
  publish:
    name: Publish @agentsmarket/pipeline-action
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify dist/ exists (build artifact from monorepo sync)
        run: |
          if [ ! -f dist/index.js ]; then
            echo "::error::dist/index.js missing — sync build artifacts from monorepo first"
            exit 1
          fi
          echo "OK: dist/index.js present"

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/pipeline-action-v')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/pipeline-action-v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version $TAG_VERSION != package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Version check passed: $PKG_VERSION"

      - name: Publish to npm
        if: github.event_name == 'push'
        run: npm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.AGENTS_MARKET_NPM_TOKEN }}

      - name: Verify on registry
        if: github.event_name == 'push'
        run: |
          sleep 5
          VERSION=$(node -p "require('./package.json').version")
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/@agentsmarket/pipeline-action/$VERSION")
          if [ "$STATUS" = "200" ]; then
            echo "OK: @agentsmarket/pipeline-action@$VERSION verified on npm"
          else
            echo "::error::npm registry returned HTTP $STATUS for $VERSION"
            exit 1
          fi
