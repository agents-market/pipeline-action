name: agentsmarket pipeline action
description: 'Run an agentsmarket pipeline.yaml inside a step (provider: minimax|openai|anthropic|openrouter). Streams each stage as a GH log group, sets action outputs with stage results, total cost, wall-clock.'
author: agentsmarket.world

inputs:
  api_key:
    description: 'LLM provider API key (falls back to MINIMAX_API_KEY / OPENAI_API_KEY / ANTHROPIC_API_KEY / OPENROUTER_API_KEY depending on provider).'
    required: false
  provider:
    description: 'LLM provider: minimax|openai|anthropic|openrouter (default: minimax). Used as the primary provider unless `primary_provider` is explicitly set.'
    required: false
    default: 'minimax'
  pipeline_file:
    description: 'Path to pipeline.yaml (relative to $GITHUB_WORKSPACE or absolute). Mutually exclusive with pipeline_yaml.'
    required: false
  pipeline_yaml:
    description: 'Inline pipeline YAML string. Mutually exclusive with pipeline_file.'
    required: false
  model:
    description: 'Default model identifier. Used as the primary model unless `primary_model` is explicitly set.'
    required: false
    default: 'MiniMax-M3'
  inputs_json:
    description: 'JSON object of pipeline inputs (passed to spec.inputs).'
    required: false
    default: '{}'
  fail_fast:
    description: 'Stop on first stage error.'
    required: false
    default: 'true'
  mock:
    description: 'Use a deterministic mock provider (no real LLM API). Useful for dry-runs + tests.'
    required: false
    default: 'false'
  context_mode:
    description: "How much code context the LLM sees beyond the PR diff. 'diff' = PR diff only (cost ~1x). 'imports' (default) = diff + imported types (~3x). 'related' = diff + files importing changed files (~10x). 'full' = diff + all .ts/.py files in repo (~100x). Actual fetching is pipeline-runtime's responsibility; this input only declares the wiring."
    required: false
    default: 'imports'
  use_dedup_reviews:
    description: 'v0.3.3+ — When true (default), the bundled `postReview()` helper posts a single PR Review per commit and edits it on subsequent runs via the PR Review API (anchored to a session marker). When false, falls back to the v0.3.1 behaviour of posting a new issue-style comment per pipeline run (no dedup). Set to false if a consumer wants the legacy behaviour for any reason.'
    required: false
    default: 'true'
  webhook_url:
    description: 'v0.3.4 — Slack / Discord / Teams incoming-webhook URL. When set, posts the run summary + findings to the webhook after each successful run (Slack Block Kit, Discord embeds, or Teams MessageCard depending on the URL host or `webhook_format`). Leave empty to disable. The URL embeds the signing secret — no extra auth header is sent.'
    required: false
  webhook_format:
    description: 'v0.3.4 — Force a specific payload format: `slack` (Block Kit), `discord` (embeds), `teams` (MessageCard), or `auto` (default — sniff from `webhook_url` hostname). Use `auto` unless the webhook lives behind a custom domain that proxies to one of the supported providers.'
    required: false
    default: 'auto'

  # ---- v0.4.0 ADDITIVE: provider-fallback inputs (TASKS row 105) ----
  primary_provider:
    description: "v0.4.0+ — Override for the primary provider. Defaults to the `provider` input when unset."
    required: false
    default: 'minimax'
  primary_model:
    description: "v0.4.0+ — Override for the primary model. Defaults to the `model` input when unset."
    required: false
    default: 'MiniMax-M3'
  fallback_provider:
    description: "v0.4.0+ — Secondary provider that catches transient primary failures (429 rate-limit, 408/timeout, 5xx server error). One of `minimax | openai | anthropic`. Default `openai`, but when the matching API key is unset the fallback is silently disabled so v0.3.x consumers see no behaviour change."
    required: false
    default: 'openai'
  fallback_model:
    description: "v0.4.0+ — Model to use on the fallback provider. Default `gpt-4o-mini` (when fallback_provider is `openai`). Ignored when fallback is disabled."
    required: false
    default: 'gpt-4o-mini'
  fallback_on_error:
    description: "v0.4.0+ — Which primary error classes trigger the fallback attempt. `rate_limit` (only HTTP 429), `timeout` (408 + ETIMEDOUT/ECONNRESET), `server_error` (5xx), or `any` (all three + unknowns). Default `any`."
    required: false
    default: 'any'

  # ---- v0.4.0 ADDITIVE: SARIF output (TASKS row 106) ----
  output_format:
    description: "v0.4.0 — Format for downstream findings emission. `summary` (default) keeps v0.3.x behaviour: only the `findings_json` + `summary_only_findings_json` outputs. `sarif` additionally emits `findings_sarif` (SARIF 2.1.0 JSON) for upload to GitHub Code Scanning via `github/codeql-action/upload-sarif@v3`. Pure additive — the summary outputs ALWAYS fire regardless of this input."
    required: false
    default: 'summary'

outputs:
  result_json:
    description: 'JSON-stringified record of stage_id -> output text. Empty string for skipped stages.'
  total_ms:
    description: 'Wall-clock pipeline duration in milliseconds.'
  total_cost_usdc:
    description: 'Estimated cost in USDC with 6 decimals (e.g. "0.001234").'
  cost_usdc:
    description: 'Estimated API cost in USDC (x402 micropayment to MiniMax). Same value as total_cost_usdc; added in v0.3.2 for dashboards / billing / runaway-PR detection.'
  timing_json:
    description: 'Per-stage duration in milliseconds, JSON: {validate_ms, fetch_source_ms, run_pipeline_ms, format_output_ms}. Stages that were never measured default to 0 ms.'
  stage_count:
    description: 'Number of stages declared in the pipeline.'
  stage_<id>_ms:
    description: 'Per-stage wall-clock duration (set per stage).'
  stage_<id>_output:
    description: 'Per-stage output text (set per stage).'
  findings_json:
    description: 'Normalized review findings from structured_json stage outputs (severity, file, line, message, cwe, confidence, recommendation). Empty array when no findings.'
  summary_only_findings_json:
    description: 'Findings filtered by severity_threshold input. Empty array when none match.'
  findings_count_json:
    description: 'Aggregate counts by severity: {critical, high, medium, low}.'
  status:
    description: 'passed | failed — pass/fail decision based on fail_on input.'
  failed_count:
    description: 'Number of findings at or above fail_on threshold.'
  max_severity:
    description: 'Highest severity seen across all findings (critical|high|medium|low) or empty string when no findings.'
  webhook_status:
    description: 'v0.3.4 — Result of the optional webhook notification: `sent` when the POST succeeded (200/2xx), `skipped` when `webhook_url` is empty, or `failed` when the webhook returned a non-2xx status or the request errored (timeout, network, etc).'

  # ---- v0.4.0 ADDITIVE: provider-fallback observability outputs ----
  provider_used:
    description: "v0.4.0+ — Which provider actually served the last LLM call. `primary` when the primary succeeded (or when fallback is disabled). `fallback` when the fallback caught a retryable primary error. Empty string when the pipeline produced no LLM calls."
  cost_primary_usdc:
    description: "v0.4.0+ — USDC attributable to primary-provider calls (sum across all stages). When fallback is disabled this equals `total_cost_usdc`; when fallback fired it reflects only the primary-attempted cost."
  cost_fallback_usdc:
    description: "v0.4.0+ — USDC attributable to fallback-provider calls. Always `0.000000` when fallback never fired."
  provider_primary_error:
    description: "v0.4.0+ — Message of the most recent primary-provider error that triggered a fallback attempt. Empty string when fallback never fired or when fallback is disabled."

  # ---- v0.4.0 ADDITIVE: SARIF output (TASKS row 106) ----
  findings_sarif:
    description: 'v0.4.0 — SARIF 2.1.0 JSON document of findings (only emitted when `output_format` is `sarif`). Upload to GitHub Code Scanning via `github/codeql-action/upload-sarif@v3` to surface review results in the PR Security tab. Same findings as `findings_json`, remapped to SARIF shape with `ruleId` (CWE), `level` (error/warning/note), `locations`, `partialFingerprints` for dedup, and severity/confidence/recommendation in `properties`.'

runs:
  using: node20
  main: dist/index.js

  pre:
    - name: agentsmarket validate (pre-flight schema check)
      id: pre
      shell: bash
      env:
        AGENTSMARKET_PIPELINE_FILE: ${{ inputs.pipeline_file }}
      run: |
        set -euo pipefail
        if [ -z "${AGENTSMARKET_PIPELINE_FILE:-}" ]; then
          echo "::notice::pre-step skipped: no pipeline_file (inline pipeline_yaml provided)"
          echo "validation_status=skipped" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if ! npx --yes @agentsmarket/cli@^0.9.0 validate "${AGENTSMARKET_PIPELINE_FILE}"; then
          echo "::error::pre-step failed: pipeline schema invalid — fix pipeline_file before re-running"
          echo "validation_status=failed" >> "$GITHUB_OUTPUT"
          exit 1
        fi
        echo "validation_status=passed" >> "$GITHUB_OUTPUT"

branding:
  icon: 'play'
  color: 'blue'
