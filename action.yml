name: agentsmarket pipeline action
description: 'Run an agentsmarket pipeline.yaml inside a step (provider: minimax|openai|anthropic|openrouter). Streams each stage as a GH log group, sets action outputs with stage results, total cost, wall-clock.'
author: agentsmarket.world

inputs:
  api_key:
    description: 'LLM provider API key (falls back to MINIMAX_API_KEY / OPENAI_API_KEY / ANTHROPIC_API_KEY / OPENROUTER_API_KEY depending on provider).'
    required: false
  provider:
    description: 'LLM provider: minimax|openai|anthropic|openrouter (default: minimax).'
    required: false
    default: 'minimax'
  pipeline_file:
    description: 'Path to pipeline.yaml (relative to $GITHUB_WORKSPACE or absolute). Mutually exclusive with pipeline_yaml.'
    required: false
  pipeline_yaml:
    description: 'Inline pipeline YAML string. Mutually exclusive with pipeline_file.'
    required: false
  model:
    description: 'Default model identifier.'
    required: false
    default: 'MiniMax-M3'
  inputs_json:
    description: 'JSON object of pipeline inputs (passed to spec.inputs).'
    required: false
    default: '{}'
  fail_fast:
    description: 'Stop on first stage error.'
    required: false
    default: 'true'
  mock:
    description: 'Use a deterministic mock provider (no real LLM API). Useful for dry-runs + tests.'
    required: false
    default: 'false'
  context_mode:
    description: "How much code context the LLM sees beyond the PR diff. 'diff' = PR diff only (cost ~1x). 'imports' (default) = diff + imported types (~3x). 'related' = diff + files importing changed files (~10x). 'full' = diff + all .ts/.py files in repo (~100x). Actual fetching is pipeline-runtime's responsibility; this input only declares the wiring."
    required: false
    default: 'imports'

outputs:
  result_json:
    description: 'JSON-stringified record of stage_id -> output text. Empty string for skipped stages.'
  total_ms:
    description: 'Wall-clock pipeline duration in milliseconds.'
  total_cost_usdc:
    description: 'Estimated cost in USDC with 6 decimals (e.g. "0.001234").'
  stage_count:
    description: 'Number of stages declared in the pipeline.'
  stage_<id>_ms:
    description: 'Per-stage wall-clock duration (set per stage).'
  stage_<id>_output:
    description: 'Per-stage output text (set per stage).'
  findings_json:
    description: 'Normalized review findings from structured_json stage outputs (severity, file, line, message, cwe, confidence, recommendation). Empty array when no findings.'
  summary_only_findings_json:
    description: 'Findings filtered by severity_threshold input. Empty array when none match.'
  findings_count_json:
    description: 'Aggregate counts by severity: {critical, high, medium, low}.'
  status:
    description: 'passed | failed — pass/fail decision based on fail_on input.'
  failed_count:
    description: 'Number of findings at or above fail_on threshold.'
  max_severity:
    description: 'Highest severity seen across all findings (critical|high|medium|low) or empty string when no findings.'

runs:
  using: node20
  main: dist/index.js

  # v0.3.0 — pre-step: pre-flight schema validation via @agentsmarket/cli
  # (npm-distributed, v0.9.0+). Skips the main step on validation failure so
  # a malformed pipeline.yaml never reaches the LLM provider. Inline
  # pipeline_yaml specs are validated by the main step itself.
  pre:
    - name: agentsmarket validate (pre-flight schema check)
      id: pre
      shell: bash
      env:
        AGENTSMARKET_PIPELINE_FILE: ${{ inputs.pipeline_file }}
      run: |
        set -euo pipefail
        if [ -z "${AGENTSMARKET_PIPELINE_FILE:-}" ]; then
          echo "::notice::pre-step skipped: no pipeline_file (inline pipeline_yaml provided)"
          echo "validation_status=skipped" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if ! npx --yes @agentsmarket/cli@^0.9.0 validate "${AGENTSMARKET_PIPELINE_FILE}"; then
          echo "::error::pre-step failed: pipeline schema invalid — fix pipeline_file before re-running"
          echo "validation_status=failed" >> "$GITHUB_OUTPUT"
          exit 1
        fi
        echo "validation_status=passed" >> "$GITHUB_OUTPUT"

branding:
  icon: 'play'
  color: 'blue'
